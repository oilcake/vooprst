[workspace.dependencies]
crossbeam-channel = "0.5"
wgpu = "25.0"
winit = { version = "0.29", features = ["android-native-activity"] }
ffmpeg-next = "6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
